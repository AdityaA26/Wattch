name: Verify Wattch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ""
      DATABASE_URL: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify household backend
        run: python -m unittest person4.tests person4.tests_upgrade person4.tests_gemini person4.tests_dashboard person4.tests_demo_api
      - name: Verify forecast and API components
        run: python -m unittest discover -s tests
      - name: Verify frontend data calculations
        run: node --test tests/test_wattch_ui_analytics.mjs tests/test_insights_bridge.mjs tests/test_dashboard_data.mjs
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build the production frontend
        run: npm run build --prefix frontend
      - name: Validate simulator wiring JSON
        run: python -m json.tool hardware/smart-breaker/diagram.json > /dev/null
